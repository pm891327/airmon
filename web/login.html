<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en Airmon Industries">
    <link rel="stylesheet" href="web/css/style.css">
    <title>Iniciar sesión | Airmon Industries</title>
</head>
<body class="login-page">
    <main class="login-container">
        <a href="web/index.html" class="login-logo">
            AIRMON <span>INDUSTRIES</span>
        </a>
        <section class="login-card">
            <div class="login-heading">
                <p class="login-eyebrow">Bienvenido de nuevo</p>
                <h1>Iniciar sesión</h1>
                <p>Accede a tu cuenta Airmon Industries.</p>
            </div>
            <form class="login-form">
                <div class="login-field">
                    <label for="email">Correo electrónico</label>
                    <input type="email" name="email" id="email" autocomplete="email" placeholder="ejemplo@ejemplo.com" required>

                </div>
                <div class="login-field">
                    <label for="password">Contraseña</label>
                    <input type="password" name="password" id="password" placeholder="Introduce tu contraseña" autocomplete="current-password" required>
                </div>
                <div class="login-options">
                    <label for="remember-option" class="remember-option">
                        <input type="checkbox" name="remember" id="remember">
                        <span>Recordarme</span>
                    </label>
                    <a href="#" class="login-link">Olvidaste tu contraseña</a>

                </div>
                <button type="submit" class="login-submit">Iniciar sesión</button>
            </form>
            <div class="login-divider">
                <span>¿Aún no tienes cuenta?</span>
            </div>
            <a href="register.html" class="login-register">Crear cuenta</a>
        </section>
        <a href="web/index.html">Volver a la tienda</a>
        <p class="login-footer"> © 2026 Airmon Industries. Todos los derechos reservados.</p>
    </main>
</body>
</html>
