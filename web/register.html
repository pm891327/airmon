<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en Airmon Industries">
    <link rel="stylesheet" href="css/style.css">
    <title>Crear cuenta | Airmon Industries</title>
</head>
<body class="login-page">
    <main class="login-container">
        <a href="index.html" class="login-logo">
            AIRMON <span>INDUSTRIES</span>
        </a>
        <section class="login-card register-card">
            <div class="login-heading">
                <p class="login-eyebrow">Bienvenido</p>
                <h1>Crear cuenta</h1>
                <p>Crea una cuenta en Airmon Industries.</p>
            </div>

            <form class="login-form" id="register-form">
                
                <div class="login-field">
                    <label for="name">Nombre completo</label>
                    <input type="text" name="name" id="name" placeholder="Tu nombre" autocomplete="name" required>
                </div>
                <div class="login-field">
                    <label for="email">Correo electrónico</label>
                    <input type="email" name="email" id="register-email" autocomplete="email" placeholder="ejemplo@ejemplo.com" required>
                </div>
                <div class="login-field">
                    <label for="password">Contraseña</label>
                    <input type="password" name="password" id="register-password" placeholder="Introduce tu contraseña" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="login-field">
                    <label for="password">Confirma la contraseña</label>
                    <input type="password" name="password" id="password" placeholder="Confirma la contraseña" autocomplete="new-password" minlength="8" required>
                </div>
                <label class="remember-option register-terms">
                    <input type="checkbox" id="terms" required>
                    <span>
                        He leido y acepto los
                        <a href="terms.html" class="login-link">terminos y condiciones</a>
                    </span>
                </label>

            </form>
        </section>
    </main>

</body>
</html>
